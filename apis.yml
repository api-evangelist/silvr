aid: silvr
name: Silvr
description: 'Silvr (Silvr Groupe SAS, Neuilly-sur-Seine, France) was a French fintech that brought
  Revenue Based Financing to Europe, underwriting non-dilutive growth capital for e-commerce, SaaS and
  digital SMEs from its own Silvr Analytics scoring model and later broadening into flexible business
  loans of EUR 5k-10M covering receivables advances, inventory and equipment financing and working
  capital. Founded in 2020 by Nima Karimi and Gregory Tappero, it raised a EUR 130M Series A plus EUR
  200M in debt from Citi and Channel, with ISAI, Serena, XAnge, Otium, Eurazeo and Bpifrance on the
  cap table. Silvr declared cessation of payments in June 2025; on 2 December 2025 the Nanterre court
  awarded Karmen the takeover of all Silvr assets except the non-performing loan portfolio, and
  silvr.co now redirects applicants and logins to app.karmen.io. Silvr marketed an embedded-finance
  partner API for real-time eligibility, but never published a developer portal, API reference or
  machine-readable contract, and that partner funnel now points at Karmen.'
